<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Học tiếng Anh từ sơ cấp: ngữ pháp, nghe, từ vựng mỗi ngày, luyện phát âm và nghe hiểu.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Lớp Tiếng Anh Mỗi Ngày</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700&family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+Mono:wght@400;500&display=swap">
<style>
/* Layout: lớp học bảng đen — thanh trên cố định, cột nội dung 760px, bài học chia 4 thẻ */
:root{
  --bg:#f6f8f6; --paper:#ffffff; --ink:#18231f; --muted:#5b6a64; --line:#dbe3df;
  --board:#1f4b42; --board-ink:#eaf3ef; --chalk:#f3c94a; --chalk-soft:#fbefc4;
  --ok:#1f8a4c; --ok-soft:#dff3e6; --bad:#c2412d; --bad-soft:#fbe4df;
  --sub:#e3edf9; --sub-ink:#1f5592; --brk:#1f4b42;
  --f-display:"Lexend","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ipa:"Noto Sans Mono","Noto Sans","Segoe UI","DejaVu Sans",monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101614; --paper:#17201d; --ink:#e6eeea; --muted:#9aaca5; --line:#2a3833;
  --board:#24564c; --board-ink:#eaf3ef; --chalk:#f0c64a; --chalk-soft:#3a3420;
  --ok:#5cc489; --ok-soft:#183324; --bad:#f08b78; --bad-soft:#3b1f1a; --sub:#1c2b3d; --sub-ink:#9cc3f0; --brk:#f0c64a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --paper:#17201d; --ink:#e6eeea; --muted:#9aaca5; --line:#2a3833;
  --board:#24564c; --board-ink:#eaf3ef; --chalk:#f0c64a; --chalk-soft:#3a3420;
  --ok:#5cc489; --ok-soft:#183324; --bad:#f08b78; --bad-soft:#3b1f1a; --sub:#1c2b3d; --sub-ink:#9cc3f0; --brk:#f0c64a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
button,input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;text-wrap:balance;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--board);color:var(--board-ink)}
header.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.brand span{color:var(--chalk)}
.levels{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.levels button{background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--board-ink);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer}
.levels button[aria-pressed="true"]{background:var(--chalk);color:#1b1b1b;border-color:var(--chalk);font-weight:600}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--chalk);outline-offset:2px}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
section.block{margin-top:28px;display:flex;flex-direction:column;gap:12px}
.board{background:var(--board);color:var(--board-ink);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px}
.board h1{font-size:clamp(22px,5vw,30px)}
.board .eyebrow{color:#b9d3cb}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stats b{font-family:var(--f-display);font-size:22px;color:var(--chalk);display:block;line-height:1.1}
.stats small{font-size:13px;color:#b9d3cb}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:15px}
.btn:hover{border-color:var(--board)}
.btn.primary{background:var(--board);color:var(--board-ink);border-color:var(--board)}
.btn.chalk{background:var(--chalk);color:#1b1b1b;border-color:var(--chalk)}
.btn.rec{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:14px;border-radius:8px}
.btn svg{width:18px;height:18px;flex:none}
.btn[disabled]{opacity:.55;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.word{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.word.done{border-color:var(--ok);background:var(--ok-soft)}
.word h3{font-size:20px}
.ipa{font-family:var(--f-ipa);font-size:14px;color:var(--muted)}
.word .vi{font-weight:600}
.word .ex{font-size:14px;color:var(--muted);font-style:italic}
.lessons{display:flex;flex-direction:column;gap:8px}
.lesson-item{display:flex;align-items:center;gap:14px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.lesson-item:hover{border-color:var(--board)}
.lesson-item .num{font-family:var(--f-display);font-weight:700;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--chalk-soft);color:var(--ink);flex:none;font-size:15px}
.lesson-item.done .num{background:var(--ok);color:#fff}
.lesson-item .t{flex:1;min-width:0}
.lesson-item .t b{display:block;font-family:var(--f-display);font-weight:500}
.lesson-item .t small{color:var(--muted)}
.lesson-item[disabled]{cursor:default;opacity:.6}
.tag{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);overflow-x:auto;margin-top:18px}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--chalk)}
@media (max-width:560px){.tabs{display:grid;grid-template-columns:1fr 1fr;overflow:visible}.tabs button{text-align:left;padding:10px 8px}}
.teach{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.teach p{margin:0;max-width:65ch}
.teacher{display:flex;gap:12px;align-items:flex-start}
.teacher .av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--board);color:var(--chalk);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.formula{overflow-x:auto}
.formula table{border-collapse:collapse;width:100%;min-width:420px}
.formula th,.formula td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.formula th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.formula td:first-child{font-weight:600;white-space:nowrap}
.formula code{font-family:var(--f-body);background:var(--chalk-soft);padding:1px 6px;border-radius:5px;font-weight:600}
.note{border-left:4px solid var(--chalk);background:var(--chalk-soft);padding:10px 14px;border-radius:0 10px 10px 0}
.note ul{margin:4px 0 0;padding-left:20px}
.ex-list{display:flex;flex-direction:column;gap:8px}
.ex-item{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.ex-item .txt{flex:1;min-width:0}
.ex-item .en{font-weight:600;font-size:17px}
.ex-item .vi{color:var(--muted);font-size:15px}
.ex-item .why{font-size:14px;margin-top:4px}
.ex-item .why b{color:var(--board)}
:root[data-theme="dark"] .ex-item .why b{color:var(--chalk)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ex-item .why b{color:var(--chalk)}}
.icon-btn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:20px;height:20px}
.icon-btn:hover{border-color:var(--board)}
.icon-btn.playing{background:var(--chalk);border-color:var(--chalk);color:#1b1b1b}
.dialog{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:85%;padding:10px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--line);cursor:pointer}
.bubble.B{align-self:flex-end;background:var(--chalk-soft);border-color:transparent}
.bubble .who{font-size:12px;font-weight:700;color:var(--muted)}
.bubble .vi{font-size:14px;color:var(--muted)}
.bubble.playing{outline:2px solid var(--chalk)}
.reading{background:var(--chalk-soft)!important;outline:2px solid var(--chalk);outline-offset:4px;border-radius:8px}
.g{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12px}
.g::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--g-col)}
.g-F{--g-col:#c2569b}.g-M{--g-col:#2f74c0}
.bubble.gb-F{border-left:4px solid #c2569b}.bubble.gb-M{border-left:4px solid #2f74c0}
.chat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.chat-card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;min-width:0}
.chat-card:hover{border-color:var(--board)}
.chat-card b{font-family:var(--f-display);font-weight:500;font-size:17px}
.chat-card small{color:var(--muted)}
.big-mic{padding:12px 18px;font-size:16px}
.chat-log .bubble{cursor:default}
.chat-log .bubble .en{font-weight:600;font-size:17px}
.chat-fb{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);background:var(--paper)}
.chat-fb p{margin:0}
.chat-fb .verdict{font-family:var(--f-display);font-weight:700;font-size:17px}
.chat-fb.ok{border-color:var(--ok);background:var(--ok-soft)}.chat-fb.ok .verdict{color:var(--ok)}
.chat-fb.warn{border-color:var(--chalk);background:var(--chalk-soft)}
.chat-fb.bad{border-color:var(--bad);background:var(--bad-soft)}.chat-fb.bad .verdict{color:var(--bad)}
.chat-fb .models{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.chat-fb .model{text-align:left}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 8px;margin-right:6px}
.pill.ok{background:var(--ok);color:#fff}.pill.warn{background:var(--chalk);color:#1b1b1b}.pill.bad{background:var(--bad);color:#fff}
.sum-list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.say{color:var(--sub-ink);cursor:pointer;border-bottom:1px dotted currentColor}
.say:hover{background:var(--sub)}
s.say.wrong{color:var(--bad);border-bottom:0;text-decoration:line-through;font-weight:600}
.points{list-style:none;counter-reset:pt;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.points li{counter-increment:pt;display:grid;grid-template-columns:30px minmax(0,1fr);column-gap:12px;row-gap:2px;border-radius:8px}
.points li::before{content:counter(pt);grid-row:1 / span 2;width:28px;height:28px;border-radius:50%;background:var(--board);color:var(--board-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:14px}
.points .pt-h{font-family:var(--f-display);font-weight:500;font-size:17px;line-height:1.35}
.points p{margin:0;max-width:65ch}
.map{display:flex;flex-direction:column;gap:8px}
.map-t{font-family:var(--f-display);font-weight:500;font-size:16px;color:var(--muted)}
.map-row{display:grid;grid-template-columns:minmax(96px,max-content) 34px minmax(0,max-content) minmax(0,1fr);align-items:center;gap:6px 10px;padding:10px 14px;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.map-l{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.mi{font-weight:700;font-size:18px;line-height:1.3;border-bottom:0}
.mi.vi{font-weight:500;font-size:14px;color:var(--muted);cursor:default}
.map-l small,.map-m small{font-size:12.5px;color:var(--muted);line-height:1.3}
.map-b{align-self:stretch;position:relative;min-height:30px}
.map-b.multi::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:13px;border:3px solid var(--brk);border-left:0;border-radius:0 16px 16px 0}
.map-b.multi::after{content:"";position:absolute;left:15px;right:0;top:calc(50% - 1.5px);border-top:3px solid var(--brk)}
.map-b.single{display:grid;place-items:center;font-size:22px;font-weight:700;color:var(--brk)}
.map-m{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
.chip{display:inline-block;padding:3px 10px;border-radius:8px;font-weight:700;line-height:1.4}
.map-m .chip{font-size:17px}
.chip.say{border-bottom:0}
.chip.v{background:var(--chalk-soft);border:1px solid var(--chalk);color:var(--ink)}
.chip.v.vi{font-weight:600;font-size:15px}
.chip.s{background:var(--sub);color:var(--sub-ink)}
.chip.n{background:var(--bad-soft);color:var(--bad)}
.chip.w{background:var(--ok-soft);color:var(--ok)}
.chip.o{background:transparent;border:1px dashed var(--muted);color:var(--muted);font-weight:500}
.map-ex{display:flex;align-items:center;gap:8px;text-align:left;background:none;border:0;border-radius:8px;padding:6px 8px;cursor:pointer;font-style:italic;color:var(--ink);min-width:0}
.map-ex:hover{background:var(--bg)}
.map-ex svg{width:18px;height:18px;flex:none;color:var(--muted)}
.map-ex.playing{background:var(--chalk-soft)}
.pat{display:grid;grid-template-columns:130px minmax(0,1fr);align-items:center;gap:6px 12px;padding:10px 14px;background:var(--paper);border:1px solid var(--line);border-radius:12px}
.pat-n{font-weight:600}
.pat-p{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pat .map-ex{grid-column:2}
.plus{color:var(--muted);font-weight:700}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13px;color:var(--muted)}
.legend .chip{font-size:12px;padding:1px 7px}
@media (max-width:560px){
 .map-row{grid-template-columns:minmax(0,auto) 30px minmax(0,1fr)}
 .map-row .map-ex{grid-column:1 / -1;border-top:1px dashed var(--line);border-radius:0;padding-top:8px}
 .pat{grid-template-columns:minmax(0,1fr)}
 .pat .map-ex{grid-column:1}
}
.story{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.story-h h2{font-size:22px;margin-top:2px}
.story-words{font-size:15px;line-height:1.9}
.story-text{display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line);padding-top:10px}
.story-text .sent{display:block;cursor:pointer;border-radius:8px;padding:2px 6px;margin:0 -6px}
.story-text .sent .en{font-size:17px}
.story-text .sent .vi{display:none;color:var(--muted);font-size:14px}
.story-text.show-vi .sent .vi{display:block}
.story-text .sent.playing{background:var(--chalk-soft)}
.story-text.hidden-text .sent{display:none}
.story-text .story-cover{display:none;margin:0}
.story-text.hidden-text .story-cover{display:block}
.levels .guide-btn{border-style:dashed}
.levels .guide-btn[aria-pressed="true"]{background:var(--board-ink);color:var(--board);border-style:solid;font-weight:600}
.road-wrap{border-top:1px solid rgba(255,255,255,.14)}
.road{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.road::-webkit-scrollbar{display:none}
.road-lb{flex:none;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#b9d3cb;margin-right:6px;font-weight:600}
.rn{flex:none;display:flex;align-items:center;gap:6px;background:transparent;border:1px solid transparent;border-radius:999px;padding:3px 10px 3px 3px;color:var(--board-ink);cursor:pointer;font-size:13px;white-space:nowrap}
.rn:hover{border-color:rgba(255,255,255,.3)}
.rn.active{background:rgba(255,255,255,.14);border-color:var(--chalk)}
.rn-dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.rn-dot svg,.pn-dot svg{width:13px;height:13px}
.rn.done .rn-dot{background:#3fae6a;color:#fff}
.rn.review .rn-dot{background:var(--chalk);color:#1b1b1b}
.rn.current .rn-dot{background:#fff;color:#1f4b42;box-shadow:0 0 0 3px rgba(243,201,74,.55)}
.rn.locked{opacity:.55}
.rn.locked .rn-dot{border:1.5px solid rgba(255,255,255,.5);color:var(--board-ink)}
.rn-arr{flex:none;color:#b9d3cb;font-size:13px}
.road-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px;color:var(--muted)}
.road-legend span{display:inline-flex;align-items:center;gap:5px}
.lg{width:11px;height:11px;border-radius:50%;display:inline-block}
.lg.done{background:var(--ok)}.lg.review{background:var(--chalk)}.lg.current{background:var(--board);box-shadow:0 0 0 2px var(--chalk-soft)}.lg.locked{border:1.5px solid var(--muted)}
.path{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column}
.pn{display:grid;grid-template-columns:36px minmax(0,1fr);column-gap:12px;position:relative;padding-bottom:12px}
.pn:not(:last-child)::before{content:"";position:absolute;left:17px;top:36px;bottom:-2px;width:2px;background:var(--line)}
.pn.done:not(:last-child)::before,.pn.review:not(:last-child)::before{background:var(--ok)}
.pn:not(:last-child)::after{content:"";position:absolute;left:13px;bottom:2px;border:5px solid transparent;border-top:6px solid var(--line)}
.pn.done:not(:last-child)::after,.pn.review:not(:last-child)::after{border-top-color:var(--ok)}
.pn-dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px;position:relative;z-index:1}
.pn.done .pn-dot{background:var(--ok);color:#fff}
.pn.review .pn-dot{background:var(--chalk);color:#1b1b1b}
.pn.current .pn-dot{background:var(--board);color:var(--board-ink);box-shadow:0 0 0 4px var(--chalk-soft)}
.pn.locked .pn-dot{background:var(--bg);border:2px solid var(--line);color:var(--muted)}
.pn-card{display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer;min-width:0;width:100%}
.pn.current .pn-card{border-color:var(--board);border-width:2px}
.pn.locked .pn-card{cursor:default;background:transparent;border-style:dashed}
.pn-card:hover{border-color:var(--board)}
.pn.locked .pn-card:hover{border-color:var(--line)}
.pn-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pn-top b{font-family:var(--f-display);font-weight:500;font-size:16px}
.pn.locked .pn-top b{color:var(--muted)}
.pn-card small{color:var(--muted)}
.pill2{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill2.done{background:var(--ok-soft);color:var(--ok)}
.pill2.review{background:var(--chalk-soft);color:var(--ink)}
.pill2.current{background:var(--board);color:var(--board-ink)}
.pill2.locked{background:transparent;border:1px solid var(--line);color:var(--muted)}
.pn-bar{position:relative;display:block;height:8px;border-radius:99px;background:var(--line);margin-top:4px}
.pn-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--ok)}
.pn.current .pn-bar i,.score-panel.current .pn-bar i{background:var(--chalk)}
.pn-bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45}
.pn-meta{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pn-act{display:flex;justify-content:flex-end;margin-top:2px}
.score-panel{margin-top:12px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.score-panel p{margin:0;font-size:14px;color:var(--muted)}
.sp-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 14px;align-items:start}
.sp-it{display:flex;flex-direction:column}
.sp-it small{font-size:12.5px;color:var(--muted)}
.sp-it b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.sp-it .pill2{align-self:flex-start;margin-top:2px}
.picker .sc{font-size:12px;font-weight:700;margin-left:4px;white-space:nowrap}
.picker .sc.ok{color:var(--ok)}.picker .sc.low{color:var(--bad)}.picker .sc.none{color:var(--muted);font-weight:500}
.picker button[aria-pressed="true"] .sc{color:inherit}
.guide{display:flex;flex-direction:column;gap:18px}
.guide section{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.guide h2{font-size:19px;margin-bottom:6px}
.guide p{margin:6px 0;max-width:65ch}
.guide ul,.guide ol{margin:6px 0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.guide .preview-box{background:transparent;border-style:dashed;font-size:14px;color:var(--muted)}
@media (max-width:560px){header.top{position:static}.levels{margin-left:0}}
.hidden-vi .bubble .vi,.hidden-vi .ex-item .vi{display:none}
.practice{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.practice .target{font-size:clamp(18px,4.5vw,22px);font-weight:600;font-family:var(--f-display)}
.result{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.w{display:inline-block;padding:0 4px;border-radius:5px;margin:1px 0}
.w.ok{background:var(--ok-soft);color:var(--ok)}
.w.miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy}
.score{font-family:var(--f-display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}
.tips{margin:0;padding-left:20px;font-size:15px}
.picker{display:flex;gap:6px;flex-wrap:wrap}
.picker button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:14px;max-width:100%;text-align:left}
.picker button[aria-pressed="true"]{background:var(--board);color:var(--board-ink);border-color:var(--board)}
textarea,input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
textarea{min-height:110px;resize:vertical}
.ex-w{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ex-w.right{border-color:var(--ok)}
.ex-w.wrong{border-color:var(--bad)}
.ex-w .q{font-weight:600}
.ex-w .fb{font-size:15px}
.ex-w .fb.ok{color:var(--ok)}
.ex-w .fb.bad{color:var(--bad)}
.ex-w .inrow{display:flex;gap:8px}
.ex-w .inrow input{flex:1;min-width:0}
.alert{border-radius:10px;padding:10px 14px;background:var(--bad-soft);color:var(--ink);font-size:15px}
.alert.info{background:var(--chalk-soft)}
.fix-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.fix-list li{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg)}
.fix-list s{color:var(--bad)}
.fix-list ins{color:var(--ok);text-decoration:none;font-weight:600}
.back{background:none;border:0;color:var(--muted);cursor:pointer;padding:0;font-size:15px}
.speed{display:flex;gap:6px;align-items:center;font-size:14px}
.progress{height:8px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--chalk)}
footer{margin-top:40px;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

{id:"plural",title:"Danh từ số nhiều",sub:"book → books · child → children",
 intro:"Chào bạn! Hôm nay chúng ta học cách nói về nhiều đồ vật: danh từ số nhiều.",
 pts:[
  ["Danh từ phải đổi hình thức","Tiếng Việt chỉ cần thêm số đếm: “hai quyển sách”. Tiếng Anh phải thêm đuôi vào danh từ: [[one book]], [[two books]]."],
  ["Các cách thêm đuôi","Phần lớn danh từ thêm [[s]]. Từ tận cùng bằng [[s, x, ch, sh, o]] thì thêm [[es]]. Phụ âm cộng [[y]] thì đổi thành [[ies]]. Bạn xem sơ đồ bên dưới."],
  ["Từ bất quy tắc","Một số từ phải học thuộc: [[man, men]]. [[woman, women]]. [[child, children]]. [[foot, feet]]. [[tooth, teeth]]."],
  ["Đọc rõ âm cuối","Người Việt hay quên âm cuối. Khi nói, hãy bật rõ đuôi [[s]]: [[books]], [[boxes]], [[cars]]."]],
 maps:[{t:"Cách thêm đuôi số nhiều",rows:[
  {l:["book","cat","car"],n:"phần lớn danh từ",m:"+ s",say:"[[book, cat, car]]. Phần lớn danh từ thêm [[s]]: [[books, cats, cars]].",ex:"I have two cats."},
  {l:["box","watch","dish","tomato"],n:"tận cùng s, x, ch, sh, o",m:"+ es",say:"[[box, watch, dish, tomato]]. Tận cùng [[s, x, ch, sh, o]], thêm [[es]]: [[boxes, watches, dishes, tomatoes]].",ex:"These boxes are heavy."},
  {l:["baby","city"],n:"phụ âm + y",m:"y → ies",say:"[[baby, city]]. Phụ âm cộng [[y]], đổi thành [[ies]]: [[babies, cities]].",ex:"The babies are cute."},
  {l:["knife","leaf"],n:"tận cùng f, fe",m:"f → ves",say:"[[knife, leaf]]. Tận cùng [[f]], đổi thành [[ves]]: [[knives, leaves]].",ex:"The leaves are green."},
  {l:["man","woman","child","foot"],n:"bất quy tắc, học thuộc",m:"men · women · children · feet",say:"Từ bất quy tắc phải học thuộc: [[man, men. woman, women. child, children. foot, feet.]]",ex:"The children are happy."}]}],
 pats:[{n:"Số nhiều",p:"o:số đếm (two, three…)|v:danh từ + s / es",ex:"I have two cats."}],
 notes:["Đuôi [[s]] có ba cách đọc. Nghe và so sánh: [[books]], [[boxes]], [[cars]].","Danh từ không đếm được không thêm [[s]]: [[water]], [[rice]], [[money]]."],
 examples:[["I have two cats.","Tôi có hai con mèo.","[[cat]] thêm [[s]] thành [[cats]]."],["These boxes are heavy.","Những cái hộp này nặng.","[[box]] thêm [[es]] thành [[boxes]]."],["The children are happy.","Bọn trẻ vui vẻ.","[[child]] thành [[children]], là từ bất quy tắc."],["Three women are at the door.","Ba người phụ nữ đang ở cửa.","[[woman]] thành [[women]]."],["Brush your teeth every night.","Đánh răng mỗi tối nhé.","[[tooth]] thành [[teeth]]."]],
 dialogue:{title:"Ở chợ",sp:{A:["Người bán","M"],B:["Lan","F"]},lines:[["A","How many apples do you want?","Chị muốn mấy quả táo?"],["B","Six apples, please. And two bananas.","Cho tôi sáu quả táo. Và hai quả chuối."],["A","Anything else?","Còn gì nữa không ạ?"],["B","Yes, three tomatoes and some potatoes.","Có, ba quả cà chua và ít khoai tây."]]},
 speak:["I have two cats.","These boxes are heavy.","The children are happy.","Six apples, please.","Three tomatoes and some potatoes."],
 story:{title:"At the market",vi_title:"Ở chợ",
  text:[["On Sundays, my mother and I go to the market.","Vào các ngày Chủ nhật, mẹ và tôi đi chợ."],["We buy six apples, two kilos of potatoes and three fish.","Chúng tôi mua sáu quả táo, hai cân khoai tây và ba con cá."],["My mother also buys two boxes of eggs.","Mẹ tôi cũng mua hai hộp trứng."],["The market is very busy.","Chợ rất đông đúc."],["Many people and children are there.","Có nhiều người và trẻ em ở đó."],["The children are happy because they get sweets.","Bọn trẻ vui vì chúng được cho kẹo."]],
  words:[["market","chợ"],["potatoes","khoai tây"],["busy","đông đúc, bận rộn"],["sweets","kẹo"]],
  qs:[
   {q:"When do they go to the market?",vi:"Họ đi chợ khi nào?",good:["\\bon sundays?\\b"],ok:["\\bsundays?\\b"],models:["On Sundays."],hint:"Nghe câu đầu tiên: On … my mother and I go to the market.",tipOk:"Nói: On Sundays."},
   {q:"How many apples do they buy?",vi:"Họ mua bao nhiêu quả táo?",good:["\\b(six|6) apples\\b"],ok:["\\b(six|6)\\b"],bad:[{re:"\\b(six|6) apple\\b(?!s)",fix:"six apples",why:"Nhiều hơn một thì thêm s: apples."}],models:["They buy six apples.","Six apples."],hint:"Đếm số táo. Nhớ thêm s: … apples.",tipOk:"Nói đủ: Six apples. Nhớ đọc rõ âm s cuối."},
   {q:"How many fish do they buy?",vi:"Họ mua bao nhiêu con cá?",good:["\\b(three|3) fish\\b"],ok:["\\b(three|3)\\b"],models:["They buy three fish.","Three fish."],hint:"fish không thêm s khi nói số nhiều. Trả lời: … fish.",tipOk:"Nói đủ: Three fish."},
   {q:"What else does the mother buy?",vi:"Người mẹ còn mua thêm gì?",good:["\\b(two|2) boxes of eggs\\b"],ok:["\\beggs?\\b","\\bboxes\\b"],bad:[{re:"\\b(two|2) box of\\b",fix:"two boxes of eggs",why:"box tận cùng bằng x nên thêm es: boxes."}],models:["She buys two boxes of eggs."],hint:"Hai hộp trứng. Hộp là box, số nhiều là boxes.",tipOk:"Nói đủ: Two boxes of eggs."},
   {q:"Why are the children happy?",vi:"Tại sao bọn trẻ vui?",good:["\\bbecause they get (some )?sweets\\b"],ok:["\\bsweets?\\b","\\bcand(y|ies)\\b"],models:["Because they get sweets."],hint:"Trả lời câu hỏi Why bằng Because. Kẹo là sweets.",tipOk:"Nói đủ câu: Because they get sweets."}]}},

/* Giọng nam / nữ cho hội thoại. Trình duyệt không cho biết giới tính giọng, nên đoán theo tên giọng;

const FEM=/female|samantha|serena|libby|sonia|aria|jenny|karen|moira|tessa|fiona|victoria|zira|susan|hazel|kate|emma|ava|allison|michelle|natasha|clara|joanna|salli|kendra|kimberly|ivy|amy|martha|catherine|google us english$/i;

function genderVoices(){
 const best=re=>voices.filter(v=>re.test(v.name)&&!(re===MAL&&FEM.test(v.name))).sort((a,b)=>rankVoice(b)-rankVoice(a))[0];
 const F=best(FEM),M=best(MAL);
 if(F&&M&&F!==M)return {F,M,pitch:false};

}

  if(opts.lang==="vi"){const v=viVoice();if(v){u.voice=v;u.lang=v.lang;}else u.lang="vi-VN";u.rate=opts.rate||1;}
  else if(opts.gender){const g=genderVoices();const v=opts.gender==="F"?g.F:g.M;if(v){u.voice=v;u.lang=v.lang;}else u.lang="en-GB";if(g.pitch)u.pitch=opts.gender==="F"?1.25:0.7;u.rate=opts.rate||rate;}
  else{const v=pickVoice();if(v){u.voice=v;u.lang=v.lang;}else u.lang="en-GB";u.rate=opts.rate||rate;}
  u.onend=res;u.onerror=res;speechSynthesis.speak(u);});
}

function cleanVi(t){return t.replace(/→/g,", thành ").replace(/\s\+\s/g,", cộng ").replace(/\s\/\s/g," hoặc ").replace(/[…“”]/g,"").replace(/·/g,",");}
function cleanEn(t){return t.replace(/\s?[·\/]\s?/g,", ").replace(/\s?→\s?/g,", ").replace(/…/g,"");}
function msegs(t){
 const out=[];let last=0,m;MK.lastIndex=0;
 const push=(lang,x)=>{x=(lang==="vi"?cleanVi(x):cleanEn(x)).replace(/\s+/g," ").trim();if(!/[A-Za-z0-9À-ỹ]/.test(x))return;
  if(lang==="vi")x.replace(/([.!?:;])\s+/g,"$1\n").split("\n").forEach(y=>{if(/[A-Za-z0-9À-ỹ]/.test(y))out.push({lang,text:y.trim()});});
  else out.push({lang,text:x});};

}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function listen(){
 return new Promise((resolve,reject)=>{
  if(!SR){reject("unsupported");return;}
  const r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=3;r.continuous=false;
  let got=false;
  r.onresult=e=>{got=true;const alts=[...e.results[0]].map(a=>a.transcript);alts.conf=e.results[0][0].confidence||0;resolve(alts);};
  r.onerror=e=>{reject(e.error||"error");};
  r.onend=()=>{if(!got)reject("no-speech");};
  try{r.start();}catch(e){reject("busy");}
  listen.current=r;
 });
}

const NUM={"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten"};
function toks(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g," ").split(/\s+/).filter(Boolean).map(w=>NUM[w]||w);}
const CONTR={"i'm":["i","am"],"you're":["you","are"],"he's":["he","is"],"she's":["she","is"],"it's":["it","is"],"we're":["we","are"],"they're":["they","are"],"isn't":["is","not"],"aren't":["are","not"],"don't":["do","not"],"doesn't":["does","not"],"what's":["what","is"],"there's":["there","is"],"can't":["can","not"],"i've":["i","have"],"let's":["let","us"],"name's":["name","is"],"i'd":["i","would"],"i'll":["i","will"],"we'd":["we","would"],"we'll":["we","will"],"you'd":["you","would"],"that's":["that","is"],"won't":["will","not"],"cannot":["can","not"],"didn't":["did","not"],"wasn't":["was","not"],"haven't":["have","not"],"here's":["here","is"],"where's":["where","is"],"how's":["how","is"]};
function expand(arr){const o=[];arr.forEach(w=>{if(CONTR[w])o.push(...CONTR[w]);else o.push(w.replace(/'s$/,"s").replace(/'/g,""));});return o;}
function align(target,heard){
 const T=target,H=heard,n=T.length,m=H.length,dp=Array.from({length:n+1},()=>Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=T[i].k===H[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
 const ok=new Set();let i=0,j=0;while(i<n&&j<m){if(T[i].k===H[j]){ok.add(i);i++;j++;}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++;}
 return ok;
}
function grade(targetText,alts){
 const words=targetText.split(/\s+/).filter(Boolean);
 // mỗi từ hiển thị → các khóa so sánh
 const T=[];words.forEach((w,wi)=>{expand(toks(w)).forEach(k=>T.push({k,wi}));});
 let best=null;
 alts.forEach(a=>{const H=expand(toks(a));const ok=align(T,H);const sc=T.length?ok.size/T.length:0;if(!best||sc>best.sc)best={sc,ok,heard:a};});
 const wordOk=words.map((_,wi)=>T.filter(t=>t.wi===wi).every(t=>best.ok.has(T.indexOf(t))));
 return {words,wordOk,score:Math.round(best.sc*100),heard:best.heard};
}
const VDICT=Object.fromEntries(VOCAB.map(v=>[v[0],v[1]]));
function tipsFor(missed){
 const t=new Set();
 missed.forEach(w=>{const c=w.toLowerCase().replace(/[^a-z']/g,"");
  if(/(s|es)$/.test(c)&&c.length>3)t.add("Âm cuối /s/ hoặc /z/: người Việt hay nuốt mất. Hãy kéo dài nhẹ tiếng “xì” hoặc “zì” ở cuối từ.");
  if(/(t|d|ed)$/.test(c))t.add("Âm cuối /t/, /d/: chạm đầu lưỡi vào chân răng trên rồi bật nhẹ hơi ra, đừng bỏ âm.");
  if(/(k|ck|g)$/.test(c))t.add("Âm cuối /k/, /g/: bật hơi ở cuống lưỡi, khác chữ “c” câm của tiếng Việt.");
  if(/th/.test(c))t.add("Âm “th” (/θ/, /ð/): đặt đầu lưỡi giữa hai hàm răng rồi thổi hơi, không đọc thành “t” hay “d”.");
  if(/^v|v/.test(c))t.add("Âm /v/: răng trên chạm nhẹ môi dưới, rung dây thanh.");
  if(/r/.test(c))t.add("Âm /r/: cong lưỡi về sau, không chạm vòm miệng, không rung lưỡi như “r” tiếng Việt.");
  if(/(sh|ch)/.test(c))t.add("Âm /ʃ/ (sh) và /tʃ/ (ch): chu môi ra trước, khác âm “s” và “ch” tiếng Việt.");
  if(VDICT[c])t.add("“"+c+"” đọc là "+VDICT[c]+".");
 });
 if(!t.size&&missed.length)t.add("Nghe mẫu ở tốc độ chậm, đọc theo từng cụm từ, sau đó đọc cả câu.");
 return [...t].slice(0,4);
}

function localReview(text,speech){

 });
 const add=(re,fix,why)=>{let m;const r=new RegExp(re.source,re.flags.includes("g")?re.flags:re.flags+"g");while((m=r.exec(text))){issues.push({wrong:m[0],right:typeof fix==="function"?fix(m):fix,why});}};
 if(!speech)add(/\bi\b(?!')/g,"I","Đại từ “I” (tôi) luôn viết hoa.");

 add(/\b(he|she|it) (are|am)\b/gi,m=>m[1]+" is","He / she / it đi với is.");
 add(/\b(you|we|they) (is|am)\b/gi,m=>m[1]+" are","You / we / they đi với are.");
 add(/\b(he|she|it) don'?t\b/gi,m=>m[1]+" doesn't","He / she / it dùng doesn't.");
 add(/\b(I|you|we|they) doesn'?t\b/gi,m=>m[1]+" don't","I / you / we / they dùng don't.");
 add(/\b(doesn'?t|does not|didn'?t|did not|don'?t|do not) (has|\w+?[^s](?:es|s))\b/gi,m=>{let v=m[2].toLowerCase(),base;if(v==="has")base="have";else if(/ies$/.test(v))base=v.slice(0,-3)+"y";else if(/(sh|ch|x|o|ss)es$/.test(v))base=v.slice(0,-2);else base=v.slice(0,-1);return m[1]+" "+base;},"Sau don't / doesn't / didn't, động từ ở dạng nguyên mẫu.");
 add(/\b(he|she|it) (like|want|have|go|live|work|play|eat|drink|need|love|watch|study|come|read|speak)\b/gi,m=>{const v=m[2].toLowerCase();const map={have:"has",go:"goes",watch:"watches",study:"studies"};return m[1]+" "+(map[v]||v+"s");},"Thì hiện tại đơn: he / she / it thì động từ thêm s hoặc es.");
 add(/\ba ([aeio]\w*)/gi,m=>"an "+m[1],"Trước âm nguyên âm dùng an.");
 add(/\ban ([bcdfgjklmnpqrstvwxyz]\w*)/gi,m=>/^h(our|onest|onor)/i.test(m[1])?m[0]:"a "+m[1],"Trước âm phụ âm dùng a.");
 add(/\b(I|you|we|they|he|she|it) (reading|writing|cooking|playing|watching|eating|working|studying|learning|going|sleeping|waiting)\b/gi,m=>{const be={i:"am",he:"is",she:"is",it:"is"}[m[1].toLowerCase()]||"are";return m[1]+" "+be+" "+m[2];},"Thì tiếp diễn cần am / is / are trước V-ing.");
 return issues.filter(x=>x.wrong!==x.right);
}

/* ============ LỘ TRÌNH & ĐIỂM ============
   Điểm bài = 50% Luyện nói (trung bình điểm cao nhất của các câu mẫu) + 50% Nghe & trả lời (điểm cao nhất).
   Đạt từ 70% thì mở bài tiếp theo; từ 85% là Hoàn thành; 70–84% là Cần xem lại. */
const PASS=70,GOOD=85;
const SHORT={be:"To be",pron:"Sở hữu",art:"a / an / the",plural:"Số nhiều",ps:"Hiện tại đơn",pc:"Tiếp diễn",there:"There is / are",wh:"Từ để hỏi"};
S.sp=S.sp||{};S.qa=S.qa||{};
if(S.story){LESSONS.forEach(L=>{if(S.story[L.id]!=null&&S.qa[L.id]==null)S.qa[L.id]=Math.round(S.story[L.id]/L.story.qs.length*100);});}
function spScore(L){const m=S.sp[L.id]||{};return Math.round(L.speak.reduce((a,x)=>a+(m[x]||0),0)/L.speak.length);}
function spCount(L){const m=S.sp[L.id]||{};return L.speak.filter(x=>m[x]!=null).length;}
function qaScore(L){return S.qa[L.id]||0;}
function lessonTotal(L){return Math.round((spScore(L)+qaScore(L))/2);}
function lessonStatus(i){
 const t=lessonTotal(LESSONS[i]);
 if(t>=GOOD)return "done";if(t>=PASS)return "review";
 return (S.preview||i===0||lessonTotal(LESSONS[i-1])>=PASS)?"current":"locked";
}
const ST_LABEL={done:"Hoàn thành",review:"Cần xem lại",current:"Đang học",locked:"Chưa mở"};
const LOCK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
function dotHtml(st,i){return st==="done"?"✓":st==="review"?"!":st==="locked"?LOCK_SVG:String(i+1);}
function openLesson(id){
 const i=LESSONS.findIndex(l=>l.id===id);
 if(lessonStatus(i)==="locked"){toast("Bài này chưa mở. Hãy đạt ít nhất "+PASS+"% ở bài “"+LESSONS[i-1].title+"” trước.");return;}
 curTab="teach";lesson(id);
}

function roadMap(){

 const ol=sec.querySelector(".path");
 LESSONS.forEach((L,i)=>{
  const st=lessonStatus(i),t=lessonTotal(L),sp=spScore(L),qa=qaScore(L);
  const btn=st==="locked"?`<span class="muted" style="font-size:14px">Đạt ${PASS}% bài ${i} để mở</span>`:`<span class="btn sm ${st==="current"?"primary":""}">${st==="current"?(t>0?"Học tiếp":"Vào học"):st==="review"?"Xem lại":"Ôn lại"}</span>`;
  const li=el(`<li class="pn ${st}"><span class="pn-dot">${dotHtml(st,i)}</span><button type="button" class="pn-card" ${st==="locked"?'aria-disabled="true"':""}><span class="pn-top"><b>${i+1}. ${esc(L.title)}</b><span class="pill2 ${st}">${ST_LABEL[st]}</span></span><small>${esc(L.sub)}</small>${st==="locked"?"":`<span class="pn-bar" aria-label="Điểm ${t}%"><i style="width:${t}%"></i><em style="left:${PASS}%"></em></span><span class="pn-meta">Tổng <b>${t}%</b> · Luyện nói ${sp}% · Nghe & trả lời ${qa}%</span>`}<span class="pn-act">${btn}</span></button></li>`);
  li.querySelector(".pn-card").onclick=()=>openLesson(L.id);
  ol.append(li);
 });
 return sec;
}

 const start=async()=>{
  if(recording){try{listen.current&&listen.current.stop();}catch(e){}return;}
  try{speechSynthesis.cancel();}catch(e){}

  res.hidden=false;res.innerHTML=`<span class="muted">Hãy đọc: <b>${esc(target)}</b></span>`;
  try{
   const alts=await listen();
   const g=grade(target,alts);
   if(o.onScore)o.onScore(g.score);
   const missed=g.words.filter((_,i)=>!g.wordOk[i]);
   const verdict=g.score>=90?"Rất tốt! Phát âm rõ ràng.":g.score>=70?"Khá tốt, còn vài từ cần sửa.":g.score>=40?"Cố lên! Nghe mẫu chậm rồi đọc lại.":"Máy chưa nhận ra câu này. Đọc chậm và rõ từng từ nhé.";
   res.innerHTML=`<div class="row" style="gap:14px"><span class="score" style="color:${g.score>=70?"var(--ok)":"var(--bad)"}">${g.score}%</span><span>${verdict}</span></div>
    <div>${g.words.map((w,i)=>`<span class="w ${g.wordOk[i]?"ok":"miss"}">${esc(w)}</span>`).join(" ")}</div>
    <div class="muted" style="font-size:14px">Máy nghe được: “${esc(g.heard)}”</div>`;
   if(missed.length){const tips=tipsFor(missed);res.append(el(`<div><b>Cách sửa:</b><ul class="tips">${tips.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>`));
    const row=el(`<div class="row"><span class="muted" style="font-size:14px">Nghe lại từ sai:</span></div>`);
    [...new Set(missed)].slice(0,6).forEach(w=>{const b=el(`<button class="btn sm" type="button">${IC.spk} ${esc(w.replace(/[.,!?]/g,""))}</button>`);b.onclick=e=>sayBtn(e.currentTarget,w.replace(/[.,!?—]/g,""),0.6);row.append(b);});
    res.append(row);}
  }catch(code){res.innerHTML=`<div class="alert">${esc(srErrorText(String(code)))}</div>`;if(String(code)!=="no-speech")res.append(selfRecorder(target));}
  recording=false;rb.className="btn primary";rb.innerHTML=IC.mic+" Ghi âm lại";
 };
 rb.onclick=start;
 if(o.autostart)setTimeout(start,50);
 return box;
}

function evalTurn(T,text){
 const norm=expand(toks(text)).join(" ");
 const m=arr=>(arr||[]).some(r=>new RegExp(r).test(norm));
 const issues=[];
 (T.bad||[]).forEach(b=>{const r=new RegExp(b.re);const x=norm.match(r);if(x)issues.push({wrong:x[0],right:b.fix,why:b.why});});
 localReview(text,true).forEach(x=>{if(!issues.some(y=>y.wrong.toLowerCase()===x.wrong.toLowerCase()))issues.push(x);});
 let level;
 if(!norm)level="none";else if(m(T.good))level=issues.length?"ok":"good";else if(m(T.ok))level="ok";else level="bad";
 return {level,issues,text,rank:{good:3,ok:2,bad:1,none:0}[level]-issues.length*0.1};
}

  b.onclick=()=>chat(C.id);sec.querySelector(".chat-grid").append(b);});
 container.append(sec);
}

 stopReading();window.scrollTo(0,0);app.innerHTML="";
 const sess=chatSession;const alive=()=>sess===chatSession;
 const C=CHATS.find(c=>c.id===id);let i=0,tries=0,paused=false;const res=[];
 const back=el(`<button class="back" type="button">← Về trang chính</button>`);back.onclick=()=>{stopReading();home();};app.append(back);

 let resumeFn=null;
 pauseB.onclick=()=>{paused=!paused;pauseB.textContent=paused?"Tiếp tục":"Tạm dừng";if(paused){readToken++;try{speechSynthesis.cancel();}catch(e){}}else if(resumeFn){const f=resumeFn;resumeFn=null;f();}};

 const gate=()=>new Promise(r=>{if(!paused)r();else resumeFn=r;});

  const q=x=>b.querySelector(`[data-a="${x}"]`);
  if(q("n"))q("n").onclick=()=>{readToken++;say(en,{gender:"F"});};
  if(q("s"))q("s").onclick=()=>{readToken++;say(en,{gender:"F",rate:0.6});};
  if(q("v"))q("v").onclick=()=>{const x=b.querySelector(".vi");x.hidden=!x.hidden;q("v").textContent=x.hidden?"Xem nghĩa":"Ẩn nghĩa";};

 async function ask(){

 function controls(T){

  typeBox.querySelector("button").onclick=send;typeBox.querySelector("input").onkeydown=e=>{if(e.key==="Enter")send();};

 const PRAISE=["Good!","Very good!","Great!","Excellent!","Well done!"];
 async function judge(T,alts,conf){
  if(!alive())return;
  const r=alts.map(a=>evalTurn(T,a)).sort((a,b)=>b.rank-a.rank)[0];
  const unclear=r.level==="none"||(conf>0&&conf<0.45&&r.level!=="good");
  if(r.text)log.append(el(`<div class="bubble B"><div class="who">Bạn</div><div>${esc(r.text)}</div></div>`));
  // Đúng: good, hoặc ok mà không có lỗi ngữ pháp
  const pass=!unclear&&(r.level==="good"||(r.level==="ok"&&!r.issues.length));
  if(pass){
   res[i]=tries===0?3:2;
   const fb=el(`<div class="chat-fb ok"><div class="verdict">${r.level==="good"?"Đúng rồi!":"Đúng ý!"}</div>${r.level==="ok"&&T.tipOk?`<p>${esc(T.tipOk)}</p>`:""}</div>`);
   log.append(fb);scroll(fb);
   await co(PRAISE[(i+tries)%PRAISE.length]+(T.react?" "+T.react:""),"",{buttons:false});
   return nextTurn();
  }
  tries++;
  if(tries<2){
   const line=unclear?"Sorry, I didn't hear you clearly. Please say it again.":r.issues.length?"Almost! Please say it again.":"Hmm, not quite. Please try again.";
   const note=unclear?"Cô chưa nghe rõ. Nói to, chậm và rõ hơn nhé.":r.issues.length?"Gần đúng rồi, nhưng còn lỗi: "+r.issues.map(x=>x.wrong+" → "+x.right).join("; ")+".":"Câu trả lời chưa đúng ý câu hỏi. Nghe lại câu hỏi rồi thử lần nữa.";
   log.append(el(`<div class="chat-fb warn"><div class="verdict">Thử lại lần nữa</div><p>${esc(note)}</p></div>`));
   await co(line,"",{buttons:false});if(!alive())return;
   return controls(T);
  }
  // Sau 2 lần chưa đúng: Cô giải thích, đọc câu mẫu rồi sang câu tiếp
  res[i]=1;
  const fb=el(`<div class="chat-fb bad"><div class="verdict">Cô giải thích nhé</div><p><b>Câu hỏi nghĩa là:</b> “${esc(T.vi)}”</p><p>${esc(T.explain)}</p></div>`);
  if(r.issues.length){const ul=el(`<ul class="fix-list"></ul>`);r.issues.slice(0,3).forEach(x=>ul.append(el(`<li><s>${esc(x.wrong)}</s> → <ins>${esc(x.right)}</ins><br><span class="muted" style="font-size:14px">${esc(x.why)}</span></li>`)));fb.append(ul);}
  const md=el(`<div class="models"><b>Bạn có thể nói:</b></div>`);
  T.models.forEach(x=>{const b=el(`<button class="btn sm model" type="button">${IC.spk} ${esc(x)}</button>`);b.onclick=()=>{readToken++;say(x,{gender:"F"});};md.append(b);});
  fb.append(md);log.append(fb);scroll(fb);
  await wait(1500);if(!alive())return;
  await gate();
  const ms=T.models.slice(0,2);
  await co("You can say: "+ms.join(" Or: "),"",{buttons:false});if(!alive())return;
  await wait(1200);
  if(T.react)await co(T.react,"",{buttons:false});

 // Ví dụ

function tabListen(L,body){

   b.onclick=async()=>{readToken++;document.querySelectorAll(".playing").forEach(x=>x.classList.remove("playing"));b.classList.add("playing");await say(en,{gender:g});b.classList.remove("playing");};
   b.onkeydown=e=>{if(e.key==="Enter")b.click();};dlg.append(b);});
  const idle=()=>{delete play.dataset.on;play.innerHTML=IC.spk+" Nghe cả đoạn hội thoại";dlg.querySelectorAll(".playing").forEach(x=>x.classList.remove("playing"));};

function tabSpeak(L,body){
 const t=el(`<section class="block"></section>`);
 t.append(el(`<p style="margin:0">Chọn một câu, bấm <b>Nghe mẫu</b>, sau đó bấm <b>Ghi âm và chấm</b> rồi đọc to. Từ đọc đúng hiện màu xanh, từ cần sửa hiện màu đỏ kèm cách sửa.</p>`));

 draw();
 t.append(el(`<div class="note"><b>Cách tính điểm Luyện nói:</b> trung bình điểm cao nhất của ${L.speak.length} câu mẫu có dấu ★. Hãy đọc đủ cả ${L.speak.length} câu. Các câu hội thoại phía sau dùng để luyện thêm, không tính điểm.</div>`),el(`<span class="eyebrow">Câu mẫu ★ · Hội thoại: ${esc(dd.title)}</span>`),pick,holder);
 const own=el(`<div class="practice"><b>Hoặc tự gõ một câu / đoạn giao tiếp muốn luyện</b><input type="text" id="own-${L.id}" placeholder="Ví dụ: Can I have the bill, please?"><button class="btn" type="button">Luyện câu này</button><div></div></div>`);
 own.querySelector("button").onclick=()=>{const v=own.querySelector("input").value.trim();if(!v)return;const s=own.lastElementChild;s.innerHTML="";s.append(practiceBox(v));};
 t.append(own);
 body.append(t);
}

/* ---- 4. Nghe & trả lời: nghe đoạn văn, Cô hỏi, học viên trả lời bằng giọng nói ---- */
function tabStory(L,body){
 const St=L.story;const sess=chatSession;const alive=()=>sess===chatSession;
 const t=el(`<section class="block"></section>`);
 t.append(el(`<p style="margin:0">Nghe đoạn văn ngắn, sau đó Cô sẽ hỏi ${St.qs.length} câu. Bấm micro và trả lời bằng tiếng Anh. Trả lời đúng thì Cô chuyển câu tiếp. Sai lần đầu thì nói lại, sai lần hai Cô gợi ý, sai lần ba Cô cho đáp án.</p>`));
 // Đoạn văn
 const card=el(`<div class="story"><div class="story-h"><span class="eyebrow">Đoạn văn</span><h2>${esc(St.title)}</h2><span class="muted">${esc(St.vi_title)}</span></div></div>`);
 const ctl=el(`<div class="row"></div>`);
 const playB=el(`<button class="btn primary" type="button">${IC.spk} Nghe đoạn văn</button>`);
 const slowB=el(`<button class="btn" type="button">${IC.slow} Nghe chậm</button>`);
 const showB=el(`<button class="btn" type="button">Hiện đoạn văn</button>`);
 const viB=el(`<button class="btn" type="button">Xem bản dịch</button>`);
 ctl.append(playB,slowB,showB,viB);
 const textBox=el(`<div class="story-text hidden-text"><p class="story-cover muted">Đoạn văn đang ẩn để bạn luyện nghe. Nghe 2–3 lần, nếu cần thì bấm “Hiện đoạn văn”.</p></div>`);
 const sents=St.text.map(([en,vi])=>{const sp=el(`<span class="sent" role="button" tabindex="0"><span class="en">${esc(en)}</span> <span class="vi">${esc(vi)}</span></span>`);sp.onclick=()=>{readToken++;say(en);};textBox.append(sp);return sp;});
 const words=el(`<div class="story-words"><b>Từ mới:</b> ${St.words.map(([w,v])=>`<span class="say" data-say="${esc(w)}">${esc(w)}</span> <span class="muted">${esc(v)}</span>`).join(" · ")}</div>`);
 card.append(ctl,words,textBox);t.append(card);
 showB.onclick=()=>{const h=textBox.classList.toggle("hidden-text");showB.textContent=h?"Hiện đoạn văn":"Ẩn đoạn văn";};
 viB.onclick=()=>{if(textBox.classList.contains("hidden-text"))showB.click();const v=textBox.classList.toggle("show-vi");viB.textContent=v?"Ẩn bản dịch":"Xem bản dịch";};
 const stopStory=()=>{readToken++;try{speechSynthesis.cancel();}catch(e){}};
 const play=async(r,btn)=>{
  if(btn.dataset.on){stopStory();return;}
  const my=++readToken;btn.dataset.on=1;const old=btn.innerHTML;btn.innerHTML=IC.stop+" Dừng";
  for(let i=0;i<St.text.length;i++){if(my!==readToken)break;sents[i].classList.add("playing");await say(St.text[i][0],{rate:r});sents[i].classList.remove("playing");await wait(350);}
  delete btn.dataset.on;btn.innerHTML=old;sents.forEach(x=>x.classList.remove("playing"));
 };
 playB.onclick=()=>play(undefined,playB);slowB.onclick=()=>play(0.65,slowB);
 // Phần hỏi đáp
 t.append(el(`<h2 style="font-size:20px;margin-top:6px">Cô hỏi, bạn trả lời</h2>`));
 const log=el(`<div class="dialog chat-log" aria-live="polite"></div>`);
 const prog=el(`<div class="muted" style="font-size:14px;font-variant-numeric:tabular-nums"></div>`);
 const ctrl=el(`<div class="practice chat-ctrl"></div>`);
 const startB=el(`<button class="btn chalk big-mic" type="button">${IC.mic} Bắt đầu trả lời câu hỏi</button>`);
 ctrl.append(el(`<p style="margin:0" class="muted">Hãy nghe đoạn văn ít nhất một lần trước khi trả lời.</p>`),startB);
 t.append(log,prog,ctrl);body.append(t);
 const scroll=n=>{try{n.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(e){}};
 let i=0,tries=0;const res=[];
 async function co(en,vi,buttons){
  if(!alive())return;
  const b=el(`<div class="bubble A gb-F"><div class="who"><span class="g g-F">Cô</span></div><div class="en">${esc(en)}</div>${vi?`<div class="vi" hidden>${esc(vi)}</div>`:""}${buttons?`<div class="row" style="margin-top:6px"><button class="btn sm" type="button" data-a="n">${IC.spk} Nghe lại</button><button class="btn sm" type="button" data-a="s">${IC.slow} Chậm</button>${vi?`<button class="btn sm" type="button" data-a="v">Xem nghĩa</button>`:""}</div>`:""}</div>`);
  const q=x=>b.querySelector(`[data-a="${x}"]`);
  if(q("n"))q("n").onclick=()=>{readToken++;say(en,{gender:"F"});};
  if(q("s"))q("s").onclick=()=>{readToken++;say(en,{gender:"F",rate:0.6});};
  if(q("v"))q("v").onclick=()=>{const x=b.querySelector(".vi");x.hidden=!x.hidden;q("v").textContent=x.hidden?"Xem nghĩa":"Ẩn nghĩa";};
  log.append(b);scroll(b);await say(en,{gender:"F"});
 }
 startB.onclick=async()=>{stopStory();ctrl.innerHTML="";log.innerHTML="";i=0;res.length=0;
  await co("Now, answer my questions about the story.","",false);ask();};
 async function ask(){
  if(!alive())return;const Q=St.qs[i];tries=0;prog.textContent=`Câu ${i+1} / ${St.qs.length}`;
  await co(Q.q,Q.vi,true);if(!alive())return;controls(Q);
 }
 function controls(Q){
  ctrl.innerHTML="";
  const mic=el(`<button class="btn primary big-mic" type="button">${IC.mic} ${tries?"Bấm để nói lại":"Bấm để trả lời"}</button>`);
  const again=el(`<button class="btn" type="button">${IC.spk} Nghe lại đoạn văn</button>`);
  const typeB=el(`<button class="btn" type="button">Gõ câu trả lời</button>`);
  const typeBox=el(`<div hidden style="gap:8px"><input type="text" id="story-type" autocomplete="off" autocapitalize="sentences" placeholder="Gõ câu trả lời bằng tiếng Anh…" style="flex:1;min-width:0"><button class="btn primary" type="button">Gửi</button></div>`);
  const msg=el(`<div></div>`);
  const row=el(`<div class="row"></div>`);row.append(mic,again,typeB);ctrl.append(row,typeBox,msg);scroll(ctrl);
  again.onclick=()=>play(undefined,again);
  const showType=()=>{typeBox.hidden=false;typeBox.style.display="flex";typeBox.querySelector("input").focus();};
  typeB.onclick=showType;
  const send=()=>{const v=typeBox.querySelector("input").value.trim();if(v){ctrl.innerHTML="";judge(Q,[v],0);}};
  typeBox.querySelector("button").onclick=send;typeBox.querySelector("input").onkeydown=e=>{if(e.key==="Enter")send();};
  let rec=false;
  mic.onclick=async()=>{
   if(rec){try{listen.current&&listen.current.stop();}catch(e){}return;}
   stopStory();rec=true;mic.className="btn rec big-mic";mic.innerHTML=IC.stop+" Đang nghe… nói xong bấm để dừng";msg.innerHTML="";
   try{const alts=await listen();rec=false;ctrl.innerHTML="";judge(Q,alts,alts.conf||0);}
   catch(code){rec=false;code=String(code);
    if(code==="no-speech"){ctrl.innerHTML="";judge(Q,[""],0);return;}
    mic.className="btn primary big-mic";mic.innerHTML=IC.mic+" Bấm để trả lời";
    msg.innerHTML=`<div class="alert">${esc(srErrorText(code))}</div>`;showType();}
  };
 }
 const PRAISE=["Good!","Very good!","Great!","Excellent!","Well done!"];
 async function judge(Q,alts,conf){
  if(!alive())return;
  const r=alts.map(a=>evalTurn(Q,a)).sort((a,b)=>b.rank-a.rank)[0];
  const unclear=r.level==="none"||(conf>0&&conf<0.45&&r.level!=="good");
  if(r.text)log.append(el(`<div class="bubble B"><div class="who">Bạn</div><div>${esc(r.text)}</div></div>`));
  const pass=!unclear&&(r.level==="good"||(r.level==="ok"&&!r.issues.length));
  if(pass){
   res[i]=tries===0?3:tries===1?2:1.5;
   const fb=el(`<div class="chat-fb ok"><div class="verdict">Đúng rồi!</div>${r.level==="ok"&&Q.tipOk?`<p>${esc(Q.tipOk)}</p>`:""}</div>`);
   log.append(fb);scroll(fb);
   await co(PRAISE[(i+tries)%PRAISE.length],"",false);return next();
  }
  tries++;
  const errs=r.issues.length?`<ul class="fix-list">${r.issues.slice(0,3).map(x=>`<li><s>${esc(x.wrong)}</s> → <ins>${esc(x.right)}</ins><br><span class="muted" style="font-size:14px">${esc(x.why)}</span></li>`).join("")}</ul>`:"";
  if(tries===1){
   const note=unclear?"Cô chưa nghe rõ. Nói to, chậm và rõ hơn nhé.":r.issues.length?"Gần đúng rồi, nhưng còn lỗi:":"Câu trả lời chưa đúng. Nghe lại câu hỏi, có thể nghe lại đoạn văn, rồi trả lời lần nữa.";
   log.append(el(`<div class="chat-fb warn"><div class="verdict">Thử lại nhé</div><p>${esc(note)}</p>${errs}</div>`));
   await co(unclear?"Sorry, I didn't hear you clearly. Please say it again.":"Not quite. Please try again.","",false);if(!alive())return;
   return controls(Q);
  }
  if(tries===2){
   log.append(el(`<div class="chat-fb warn"><div class="verdict">Gợi ý của Cô</div><p><b>Câu hỏi nghĩa là:</b> “${esc(Q.vi)}”</p><p>${esc(Q.hint)}</p>${errs}</div>`));
   await co("Here is a hint. Please try again.","",false);if(!alive())return;
   return controls(Q);
  }
  res[i]=1;
  const fb=el(`<div class="chat-fb bad"><div class="verdict">Đáp án</div>${errs}<div class="models"><b>Bạn có thể trả lời:</b></div></div>`);
  Q.models.forEach(x=>{const b=el(`<button class="btn sm model" type="button">${IC.spk} ${esc(x)}</button>`);b.onclick=()=>{readToken++;say(x,{gender:"F"});};fb.querySelector(".models").append(b);});
  log.append(fb);scroll(fb);
  await co("The answer is: "+Q.models[0],"",false);if(!alive())return;
  await wait(1200);return next();
 }
 async function next(){
  if(!alive())return;await wait(500);i++;
  if(i<St.qs.length)ask();else summary();
 }
 function summary(){
  if(!alive())return;prog.textContent="";
  const right=res.filter(x=>x>1).length,first=res.filter(x=>x===3).length;
  const PTS={3:100,2:75,1.5:50,1:0};
  const pct=Math.round(St.qs.reduce((a,_,k)=>a+(PTS[res[k]]||0),0)/St.qs.length);
  const prevTot=lessonTotal(L);
  S.qa[L.id]=Math.max(S.qa[L.id]||0,pct);save();refreshScore(L);
  const tot=lessonTotal(L),idxL=LESSONS.indexOf(L);
  const unlockMsg=idxL<LESSONS.length-1?(tot>=PASS?(prevTot<PASS?" Bài tiếp theo vừa được mở!":" Bài tiếp theo đã mở."):` Cần đạt ${PASS}% để mở bài tiếp theo. Hãy luyện nói đủ câu mẫu và làm lại phần này.`):"";
  const lab=x=>x===3?["ok","Đúng ngay"]:x===2?["warn","Đúng lần 2"]:x===1.5?["warn","Đúng sau gợi ý"]:["bad","Cần luyện"];
  const all=first===St.qs.length;
  const box=el(`<div class="chat-fb ${all?"ok":"warn"}"><div class="verdict">Kết quả: đúng ${right}/${St.qs.length} câu · ${pct}%</div><p>${all?"Tuyệt vời! Bạn nghe hiểu rất tốt.":"Nghe lại đoạn văn và làm lại để trả lời đúng ngay từ lần đầu."} Điểm Nghe & trả lời cao nhất: ${qaScore(L)}%. Điểm bài: ${tot}%.${unlockMsg}</p><ul class="sum-list">${St.qs.map((Q,k)=>{const l=lab(res[k]);return `<li><span class="pill ${l[0]}">${l[1]}</span> ${esc(Q.q)}</li>`;}).join("")}</ul></div>`);
  log.append(box);scroll(box);
  say(all?"Great job! You understand the story very well.":"Good effort! Listen again and try one more time.",{gender:"F"});
  ctrl.innerHTML="";const row=el(`<div class="row"></div>`);
  const re=el(`<button class="btn" type="button">Làm lại</button>`);re.onclick=()=>{curTab="story";lesson(L.id);};
  row.append(re);
  const idx=LESSONS.indexOf(L);
  if(idx<LESSONS.length-1&&lessonStatus(idx+1)!=="locked"){const nx=el(`<button class="btn primary" type="button">Bài tiếp: ${esc(LESSONS[idx+1].title)} →</button>`);nx.onclick=()=>openLesson(LESSONS[idx+1].id);row.append(nx);}
  else if(spCount(L)<L.speak.length){const sp=el(`<button class="btn primary" type="button">Sang phần 3. Luyện nói</button>`);sp.onclick=()=>{curTab="speak";lesson(L.id);};row.append(sp);}
  ctrl.append(row);
 }
}

renderLevels();if(!S.guideSeen){S.guideSeen=1;save();guide();}else home();
